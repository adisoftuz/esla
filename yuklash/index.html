<!DOCTYPE html>
<html lang="uz">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Esla — Google Play'dan yuklab olish</title>
<meta name="description" content="Esla: telefon qulf ekranida koreys va ingliz tili so'zlarini o'rganing. Bepul, Google Play'da.">
<meta property="og:title" content="Esla — qulf ekranida so'z o'rganing">
<meta property="og:description" content="Koreys va ingliz tili. Telefonni qo'lga olganingizda yangi so'z. Bepul.">
<meta property="og:image" content="https://adisoftuz.github.io/esla/yuklash/og.png">
<meta property="og:url" content="https://adisoftuz.github.io/esla/yuklash/">
<meta property="og:type" content="website">
<link rel="preconnect" href="https://play.google.com">
<script>
// Opens Esla in Google Play as fast as possible. UTM parameters from the ad
// link are passed to Play as the install referrer (Play Console attribution).
(function () {
  var pkg = 'adi.esla';
  var params = new URLSearchParams(location.search);
  var utm = [];
  ['utm_source', 'utm_medium', 'utm_campaign', 'utm_content', 'utm_term'].forEach(function (k) {
    if (params.get(k)) utm.push(k + '=' + params.get(k));
  });
  if (!utm.length) utm = ['utm_source=instagram', 'utm_medium=social'];
  var referrer = encodeURIComponent(utm.join('&'));
  var web = 'https://play.google.com/store/apps/details?id=' + pkg + '&referrer=' + referrer;
  var intent = 'intent://details?id=' + pkg + '&referrer=' + referrer +
    '#Intent;scheme=market;package=com.android.vending;S.browser_fallback_url=' + encodeURIComponent(web) + ';end';
  var ua = navigator.userAgent || '';
  var android = /android/i.test(ua);
  var ios = /iphone|ipad|ipod/i.test(ua);
  window.ESLA = { web: web, intent: intent, android: android, ios: ios };
  if (android) {
    // Play Store app directly; if the in-app browser blocks it, the Play web
    // page (whose "Install" button opens the Play app) a moment later.
    var left = false;
    var stop = function () { left = true; };
    document.addEventListener('visibilitychange', function () { if (document.hidden) stop(); });
    window.addEventListener('pagehide', stop);
    window.addEventListener('blur', stop);
    location.href = intent;
    setTimeout(function () { if (!left && !document.hidden) location.replace(web); }, 1500);
  } else if (!ios) {
    location.replace(web);
  }
})();
</script>
<style>
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; }
  body {
    background: linear-gradient(180deg, #0F9176 0%, #0B3C52 100%);
    color: #fff; font-family: -apple-system, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    display: flex; align-items: center; justify-content: center; text-align: center; padding: 24px 16px;
  }
  main { max-width: 420px; width: 100%; }
  img.logo { width: 96px; height: 96px; border-radius: 24px; box-shadow: 0 10px 30px rgba(0,0,0,.25); }
  h1 { font-size: 34px; margin: 16px 0 6px; }
  p.tag { font-size: 18px; margin: 0 0 20px; opacity: .92; line-height: 1.4; }
  ul { list-style: none; padding: 0; margin: 0 0 28px; font-size: 16px; line-height: 1.9; opacity: .92; }
  a.btn {
    display: block; background: #fff; color: #0B3C52; text-decoration: none; font-weight: 700; font-size: 19px;
    padding: 18px 20px; border-radius: 16px; box-shadow: 0 8px 24px rgba(0,0,0,.2);
  }
  a.btn:active { transform: scale(.98); }
  .small { font-size: 14px; opacity: .8; margin-top: 14px; }
  #ios { display: none; background: rgba(255,255,255,.14); border-radius: 14px; padding: 14px; margin-top: 16px; font-size: 15px; }
</style>
</head>
<body>
<main>
  <img class="logo" src="esla.png" width="96" height="96" alt="Esla">
  <h1>Esla</h1>
  <p class="tag">Telefonni qo'lga olganingizda qulf ekranida yangi so'z</p>
  <ul>
    <li>🇰🇷 Koreys va 🇬🇧 ingliz tili</li>
    <li>🔒 Qulf ekranida o'rganish</li>
    <li>📈 10 bosqich, 1 oyda gaplashish</li>
  </ul>
  <a class="btn" id="go" href="https://play.google.com/store/apps/details?id=adi.esla">▶ Google Play'dan yuklab olish</a>
  <div class="small">Bepul · Android</div>
  <div id="ios">iPhone versiyasi tez orada. Hozircha Esla faqat Android uchun.</div>
</main>
<script>
  (function () {
    var e = window.ESLA, btn = document.getElementById('go');
    btn.href = e.web;
    if (e.android) btn.addEventListener('click', function (ev) { ev.preventDefault(); location.href = e.intent; });
    if (e.ios) document.getElementById('ios').style.display = 'block';
  })();
</script>
</body>
</html>
